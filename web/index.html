<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b8412b">
<title>Trening skrzydłowego</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trening">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a training companion for a father and his 12-year-old winger
   IDEA a coach's clipboard on a tartan pitch: today's card, animated drill boards, a logbook, a reward shop
   PICTURE the live session: drill board that plays the movement, with a thumb-reach counter panel; shop: points balance large
   COLOUR tartan red header and actions, pitch green boards and balance, cone orange accent, blue for dad
   TYPE Barlow Condensed 700 + Barlow
   LAYOUT phone column: header, scrolling content, bottom tabs; sessions swap tabs for a sticky control panel */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#14100e);--bg2:light-dark(#efe9e5,#0d0a09);--ink:light-dark(#1d1613,#f2ebe6);--mut:light-dark(#62574f,#b8ada6);--line:light-dark(#e6ddd8,#302824);--card:light-dark(#faf6f3,#1e1916);--tar:#b8412b;--tar2:light-dark(#9c3522,#e0664d);--grn:#23703f;--cone:#ff8a1a;--blue:light-dark(#245fc2,#7aa6f2);--blue2:#2f6fd6;--ok:light-dark(#1f7a44,#4cc27c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg2);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
header{background:var(--tar);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
header h1{font:700 26px/1.05 "Barlow Condensed",sans-serif;margin:0}
header small{display:block;font-size:13px;opacity:.92}
.hbtn{width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.hbtn svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;padding:16px 16px 28px}
h2{font:700 28px/1.05 "Barlow Condensed",sans-serif;margin:4px 0 10px}
h3{font:700 22px/1.1 "Barlow Condensed",sans-serif;margin:0}
p{margin:0 0 8px}
a{color:var(--tar2)}
.mut{color:var(--mut);font-size:15px}
nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;min-height:56px;font-weight:600;font-size:15px;color:var(--mut);cursor:pointer;padding:0 2px}
nav.tabs button[aria-current=true]{color:var(--tar2);box-shadow:inset 0 3px 0 var(--tar)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.hero{background:var(--tar);border-color:var(--tar);color:#fff}
.card.hero .mut{color:#fff;opacity:.92}
.who{font:700 15px "Barlow Condensed",sans-serif;opacity:.85}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{min-height:46px;padding:10px 18px;border-radius:10px;border:0;background:var(--tar);color:#fff;font-weight:700;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:default}
.hero .btn{background:#fff;color:#8f2f1d}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.blue{background:var(--blue2)}
.btn.ok{background:var(--ok)}
.btn.wide{width:100%}
.btn.xl{min-height:58px;font-size:19px;padding:12px 22px}
.btn+.btn.wide,.wide+.wide{margin-top:8px}
.btn:focus-visible,nav.tabs button:focus-visible,.chip:focus-visible,.play:focus-visible,.hbtn:focus-visible{outline:3px solid var(--cone);outline-offset:2px}
.link{background:none;border:0;color:var(--tar2);font-weight:600;padding:10px 0;min-height:44px;cursor:pointer;text-align:left}
.yt{display:inline-flex;align-items:center;gap:6px;min-height:40px;font-weight:600;font-size:15px;color:var(--tar2);text-decoration:none}
.yt svg{width:22px;height:16px;flex:none}
.badge{display:inline-block;background:var(--cone);color:#2a1500;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;margin-left:6px;vertical-align:middle}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:14px}
.day{border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:13px;line-height:1.25}
.day b{display:block;font:700 16px "Barlow Condensed",sans-serif}
.day.today{border:2px solid var(--tar);background:color-mix(in srgb,var(--tar) 8%,var(--bg))}
.day .s{color:var(--tar2);font-weight:600}.day .t{color:var(--blue);font-weight:600}
.dots{height:10px;display:flex;justify-content:center;gap:3px;margin-top:3px}
.dots i{width:8px;height:8px;border-radius:50%;display:block}
.dots .ds{background:var(--tar)}.dots .dt{background:var(--blue2)}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.meter i{display:block;height:100%;background:var(--tar)}
.meter.t i{background:var(--blue2)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{min-height:44px;border:0;background:transparent;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--blue2);color:#fff}
.list{margin:6px 0 10px;padding-left:20px;color:var(--mut);font-size:15px}
.list li{padding:2px 0}
.board{position:relative;width:100%;background:var(--grn);border-radius:12px 12px 0 0;overflow:hidden;max-height:42vh}
.board svg{position:absolute;inset:0;width:100%;height:100%}
.play{width:100%;min-height:44px;border:0;border-radius:0 0 12px 12px;background:#174d2b;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-bottom:10px}
.play svg{width:14px;height:14px}
.eq{background:color-mix(in srgb,var(--cone) 12%,var(--bg));border:1px solid color-mix(in srgb,var(--cone) 45%,var(--line));border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
.eq b{display:block;font:700 18px "Barlow Condensed",sans-serif}
.lvtag{display:inline-block;background:var(--blue2);color:#fff;border-radius:6px;padding:1px 8px;font:700 13px Barlow,sans-serif;margin-left:6px;vertical-align:middle;white-space:nowrap}
.hero .lvtag{background:#fff;color:#8f2f1d}
.lvnote{border-left:3px solid var(--blue2);padding-left:12px;font-size:15px;margin:8px 0;font-weight:600}
.tips{margin:10px 0;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card)}
.tips summary{min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--tar2)}
.tips dl{margin:0 0 12px}.tips dt{font-weight:700;font-size:14px;margin-top:8px}.tips dd{margin:2px 0 0;font-size:15px;color:var(--mut)}
.track{display:grid;grid-template-columns:minmax(0,1fr) 7.5em;gap:10px;align-items:center;background:color-mix(in srgb,var(--blue2) 8%,var(--bg));border:1px solid color-mix(in srgb,var(--blue2) 35%,var(--line));border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
.track label{font-weight:600}
.pack{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;font-size:17px;font-weight:600}
.pack:first-of-type{border-top:0}
.pack input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--ok)}
.pack small{display:block;font-size:14px;font-weight:400;color:var(--mut)}
.pack input:checked+span{opacity:.5;text-decoration:line-through}
input[type=time]{width:100%;min-height:44px;font-size:16px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.famcode{font:700 clamp(24px,7.4vw,38px)/1.1 "Barlow Condensed",sans-serif;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-align:center;background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:12px;margin:8px 0 12px;user-select:all}
.pcard{display:grid;gap:6px;width:100%;text-align:left;border:0;border-radius:16px;padding:20px;margin-bottom:12px;color:#fff;cursor:pointer;min-height:120px;font:inherit}
.pcard b{font:700 32px/1.05 "Barlow Condensed",sans-serif}.pcard span{font-size:15px;opacity:.95}
.pcard.s{background:var(--tar)}.pcard.t{background:var(--blue2)}
.pcard:focus-visible{outline:3px solid var(--cone);outline-offset:3px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--cone)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.meta span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-weight:600;font-size:14px;white-space:nowrap}
.cue{border-left:3px solid var(--cone);padding-left:12px;color:var(--mut);font-size:15px}
.drill{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.panel{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);background:var(--card)}
.panel .cnt{flex:1}
.panel .cnt b{font:700 40px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.panel .cnt b small{font-size:22px;color:var(--mut)}
.panel .cnt span{display:block;font-size:14px;color:var(--mut);font-weight:600;line-height:1.25}
.panel .big{font:700 44px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;flex:1}
.panel .big.done{color:var(--ok)}
.panel .btn.xl{padding:12px 18px}
.undo{min-height:44px;min-width:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer;padding:0 10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.ex .hd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.ex .n{font:700 22px "Barlow Condensed",sans-serif;color:var(--blue)}
.ex .last{font-size:14px;color:var(--mut);margin-top:4px}
.ex .hint{font-size:14px;color:var(--ok);font-weight:600}
.plate{font-size:14px;color:var(--blue);font-weight:600;margin-top:4px;min-height:1px}
.set{display:grid;grid-template-columns:2em minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:end;margin-top:8px}
.set label{font-size:13px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{width:100%;min-height:44px;font-size:16px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.set .k{font:700 18px "Barlow Condensed",sans-serif;text-align:center;padding-bottom:10px}
.tick{width:52px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center}
.tick svg{width:22px;height:22px;stroke:var(--mut)}
.tick.on{background:var(--ok);border-color:var(--ok)}
.tick.on svg{stroke:#fff}
.foot{display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.foot .btn{flex:1}
.rest{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--blue2);color:#fff}
.rest b{font:700 34px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;flex:1}
.rest button{min-height:44px;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-weight:600;cursor:pointer}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0 12px}
.form.one{grid-template-columns:minmax(0,1fr)}
.form label,.lbl{font-size:14px;color:var(--mut);display:block}
.form input,.wsel select,.inp{width:100%;min-height:44px;font-size:16px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea.inp{min-height:110px;font-size:14px;font-family:ui-monospace,monospace}
.metric{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.metric svg{width:90px;height:34px}
.metric small{color:var(--mut);font-size:14px;display:block}
.hist{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.hist:first-of-type{border-top:0}
.hist small{color:var(--mut);font-size:14px;display:block}
.pp{font:700 18px "Barlow Condensed",sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.pp.plus{color:var(--ok)}.pp.minus{color:var(--tar2)}
.del{min-height:44px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:14px;cursor:pointer}
.ptab{width:100%;border-collapse:collapse;font-size:15px}
.ptab td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.ptab td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px}
.wsel{display:grid;grid-template-columns:3em minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px}
.wsel b{font:700 18px "Barlow Condensed",sans-serif}
.bal{background:var(--grn);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center}
.bal .coin{width:76px;height:76px}
.bal b{font:700 clamp(48px,14vw,64px)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.bal span{font-size:15px;opacity:.92}
.lvl{grid-column:1/3;margin-top:8px;font-size:15px}
.lvl .meter{background:rgba(255,255,255,.25);margin-bottom:0}
.lvl .meter i{background:#ffd84a}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .cost{font:700 20px "Barlow Condensed",sans-serif;color:var(--tar2);white-space:nowrap}
.item .meter{grid-column:1/3;margin:2px 0 0}
.goalbtn{background:none;border:0;padding:6px 0;min-height:36px;color:var(--mut);font-size:14px;font-weight:600;cursor:pointer;display:block}
.goalbtn[aria-pressed=true]{color:var(--cone)}
.grades{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:8px 0}
.grades button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:700 24px "Barlow Condensed",sans-serif;cursor:pointer}
.grades button small{display:block;font:600 12px Barlow,sans-serif;color:var(--ok)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 5.5em 44px;gap:6px;margin-bottom:6px}
.ed.it{grid-template-columns:minmax(0,1fr) 5.5em 44px;padding:10px 0;border-top:1px solid var(--line);margin:0}
.ed.it>input:first-child{grid-column:1/4}
.ed select{width:100%;min-height:44px;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer;white-space:nowrap}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin:0 -2px}
.cats .chip{flex:none;min-height:40px;padding:6px 14px}
.cats .chip[aria-pressed=true]{background:var(--tar);border-color:var(--tar);color:#fff}
.cathd{font:700 17px "Barlow Condensed",sans-serif;color:var(--mut);margin:14px 0 0;padding-top:10px;border-top:2px solid var(--line)}
.cathd:first-of-type{margin-top:4px}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px;margin-top:10px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:13px;line-height:1.25;color:var(--mut)}
.bd b{display:block;font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.bd.off b{color:var(--mut)}
.medal{width:40px;height:48px}
.heat{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;margin:8px 0}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--line)}
.heat i.s{background:var(--tar)}.heat i.t{background:var(--blue2)}.heat i.st{background:linear-gradient(135deg,var(--tar) 50%,var(--blue2) 50%)}.heat i.m{background:var(--cone)}
.heat i.f{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mut)}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;margin:8px 0}
.stat b{display:block;font:700 28px/1 "Barlow Condensed",sans-serif;color:var(--tar2)}
.stat span{font-size:13px;color:var(--mut)}
.bars .r{display:grid;grid-template-columns:3.4em minmax(0,1fr) 5.8em;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.bars .r i{display:block;height:14px;background:var(--blue2);border-radius:3px;min-width:2px}
.bars .r span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stepper button{height:44px;border:0;background:var(--card);font-size:22px;font-weight:700;cursor:pointer}
.stepper output{text-align:center;font:700 22px "Barlow Condensed",sans-serif}
.stars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stars button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:700 18px "Barlow Condensed",sans-serif;cursor:pointer}
.stars button[aria-pressed=true]{background:var(--cone);border-color:var(--cone);color:#2a1500}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-top:1px solid var(--line);cursor:pointer}
.sw:first-of-type{border-top:0}
.sw input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0}
.sw input::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked{background:var(--ok)}.sw input:checked::after{left:25px}
.sw input:focus-visible{outline:3px solid var(--cone);outline-offset:2px}
.sum{text-align:center;padding:6px 0 10px}
.sum .big{font:700 clamp(46px,14vw,64px)/1 "Barlow Condensed",sans-serif;color:var(--ok)}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;margin:12px 0}
.sumrow b{display:block;font:700 26px/1.1 "Barlow Condensed",sans-serif}
.sumrow span{font-size:13px;color:var(--mut)}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.modal .card{width:100%;max-width:340px;background:var(--bg)}
canvas.conf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:90vw;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.empty{color:var(--mut);font-size:15px;padding:6px 0}
details summary{cursor:pointer}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.hbtn.stop{width:auto;padding:0 12px 0 10px;gap:6px;display:flex;align-items:center;font-weight:700;font-size:15px;background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.75)}
.hbtn.stop svg{width:16px;height:16px}

{id:'mc_chili',mc:1,n:'Chili con carne',c:'obiad',e:'🫘',s:MC,u:'',p:6,t:82,i:[['Mięso mielone mieszane',600,'g'],['Pomidory krojone (puszka 400 g)',2,'pusz'],['Czerwona fasola (puszka)',1,'pusz'],['Kukurydza konserwowa (puszka)',1,'pusz'],['Cebula',3,'szt'],['Czosnek',3,'zab'],['Koncentrat pomidorowy',3,'lyz'],['Tabasco',null,'','o'],['Olej',6,'lyz','d'],['Papryka słodka',3,'lyzc','d'],['Kumin mielony',1.5,'lyzc','d'],['Sól i pieprz',null,'','d']],
st:'Cebule (połówki) i czosnek: 8 s / obr. 6 z miarką, zgarnij. Dodaj 3 łyżki oleju i duś Przysmażanie 3 min / 120°C bez miarki.\nDodaj połowę mięsa, smaż Przysmażanie bez miarki i przełóż do miski. Wlej resztę oleju i tak samo usmaż resztę mięsa.\nWłóż odłożone mięso, dodaj pomidory, koncentrat, 1½ łyżeczki soli, ¼ łyżeczki pieprzu i paprykę. Gotuj z miarką 25 min / 100°C / obr. 1, obroty wsteczne.\nDodaj opłukaną fasolę i kukurydzę, kumin i kilka kropel tabasco. Podgrzewaj jeszcze kilka minut na obrotach wstecznych.'},
{id:'mc_pizza',mc:1,h:1,n:'Pizza na patelni',c:'obiad',e:'🍕',s:MC,u:MCU+'pizza-na-patelni',p:1,t:35,i:[['Szynka',50,'g'],['Ser żółty',50,'g'],['Jajka',1,'szt'],['Mleko',20,'ml'],['Ketchup',2,'lyz'],['Mąka',140,'g','d'],['Olej',20,'ml','d'],['Oregano, zioła prowansalskie, sól',null,'','d']],
st:'Do pojemnika: 140 g mąki, jajko, szczypta soli, 20 g mleka, 20 g oleju i 10 g wody.\nZagniataj programem Zagniatanie (twarde ciasto).\nPatelnię posmaruj olejem, rozgnieć na niej ciasto i podpiekaj na małym ogniu 5–10 min z jednej strony.\nPosmaruj keczupem, posyp oregano i ziołami, ułóż szynkę, ulubione dodatki i ser. Dopiecz pod przykryciem, aż ser się roztopi.'},

{id:'mc_kotleciki',mc:1,n:'Pieczone kotleciki z indyka i kaszy',c:'obiad',e:'🍖',s:MC,u:MCU+'pieczone-kotleciki-mielone',p:8,pu:PU_KOT,t:30,i:[['Indyk mielony',300,'g'],['Kasza jęczmienna ugotowana',100,'g'],['Marchew',100,'g'],['Cebula (mała)',1,'szt'],['Natka pietruszki',1,'pecz'],['Czosnek',1,'zab'],['Lubczyk',null,'','o'],['Musztarda',1,'lyzc','d'],['Majeranek',1,'lyzc','d'],['Pieprz',null,'','d']],
st:'Nagrzej piekarnik do 180°C, blachę wyłóż papierem.\nCebulę, czosnek, marchew w kawałkach oraz listki pietruszki i lubczyku rozdrobnij w pojemniku, zgarnij łopatką (w razie potrzeby powtórz).\nDodaj mięso, kaszę, majeranek, musztardę i szczyptę pieprzu. Mieszaj 1 min / obr. 3, obroty wsteczne.\nMokrymi dłońmi uformuj 8 kotlecików i piecz 15–20 min.'},
{id:'mc_placki',mc:1,n:'Placki ziemniaczane chrupiące',c:'obiad',e:'🥔',s:MC,u:MCU+'placki-ziemniaczane-chrupiace-2',p:4,i:[['Ziemniaki mączyste',700,'g'],['Cebula',1,'szt'],['Jajka',2,'szt'],['Płatki owsiane błyskawiczne',4,'lyz'],['Mąka',3,'lyz','d'],['Skrobia ziemniaczana',1,'lyz','d'],['Sól, cukier, pieprz',null,'','d'],['Olej do smażenia',null,'','d']],
st:'Ziemniaki i cebulę pokrój w kawałki i rozdrobnij w pojemniku na drobną masę.\nDodaj płatki, mąkę, skrobię, jajka, 2 łyżeczki soli, łyżeczkę cukru i ½ łyżeczki pieprzu, wymieszaj.\nPrzełóż masę na sitko i odciśnij łyżką jak najwięcej płynu. Dzięki temu placki są chrupiące.\nJeśli masa dalej jest rzadka, dosyp 1–2 łyżki mąki. Smaż na rozgrzanym oleju z obu stron na złoto. Pasuje sos pieczarkowy z tej bazy.'},

{id:'mc_jarzyn',mc:1,n:'Kremowa zupa jarzynowa',c:'zupa',e:'🥕',s:MC,u:MCU+'kremowa-zupa-jarzynowa-2',p:4,t:50,i:[['Włoszczyzna (marchew, pietruszka, seler, por)',650,'g'],['Ziemniaki mączyste',300,'g'],['Pomidory',100,'g'],['Cebula (mała)',1,'szt'],['Masło',null,'','d'],['Woda',1,'l','d'],['Sól i pieprz',null,'','d']],

{id:'mc_gofry',mc:1,h:1,n:'Belgijskie gofry',c:'sniad',e:'🧇',s:MC,u:MCU+'belgijskie-gofry-3',p:4,t:45,i:[['Masło (miękkie)',250,'g'],['Mleko',250,'ml'],['Jajka',3,'szt'],['Cukier waniliowy',1,'op'],['Mąka',250,'g','d'],['Cukier',125,'g','d'],['Proszek do pieczenia',.5,'op','d'],['Sól',null,'','d'],['Cukier puder',null,'','o'],['Olej do gofrownicy',null,'','d']],

for(let i=0;i<n;i++){const d=addDays(td,i),wd=(new Date(d+'T12:00:00').getDay()+6)%7,sp=w.syn[wd],tp=w.tata[wd];
if(!(i===0&&sDone)){if(sp==='Tartan'){out.push({d,who:'syn',k:ROT_SYN[tk%ROT_SYN.length]});tk++}else if(sp==='Solo')out.push({d,who:'syn',k:'S'});else if(sp==='Dom')out.push({d,who:'syn',k:'D'})}

function icsText(){const s=S.settings,w=s.week,kd=isKid(),now=new Date(),st=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+'00Z',E=t=>String(t).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
const ev=[],add=(wd,time,mins,title,desc,eve)=>{const b=new Date();b.setHours(0,0,0,0);b.setDate(b.getDate()+((wd-dIdx()+7)%7));const [H,M]=time.split(':').map(Number);b.setHours(H,M);const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const app=$('#app'),c=document.createElement('canvas');c.className='conf';app.appendChild(c);const W=c.width=app.clientWidth,H=c.height=app.clientHeight,x=c.getContext('2d');const cols=['#b8412b','#ffd84a','#2f6fd6','#23703f','#ff8a1a','#ffffff'];const P=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*60,y:H*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:4+Math.random()*5,r:Math.random()*6,c:cols[Math.random()*cols.length|0]}));let t0=null;const f=ts=>{if(t0==null)t0=ts;const t=ts-t0;x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);x.restore()});if(t<1900)requestAnimationFrame(f);else c.remove()};requestAnimationFrame(f)}

function spark(vals,dir,color){if(vals.length<2)return '';const v=vals.map(x=>x*dir),mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;const pts=v.map((x,i)=>`${(i/(v.length-1)*86+2).toFixed(1)},${(30-(x-mn)/r*26).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 90 34" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color||'var(--tar)'}" stroke-width="2.5" stroke-linejoin="round"/></svg>`}
function heat(kd){const td=today(),start=addDays(wkOf(td),-77),syn=new Set(S.logs.filter(l=>l.kind==='syn').map(l=>l.date)),tat=new Set(kd?[]:S.logs.filter(l=>l.kind==='tata').map(l=>l.date)),mz=new Set(S.matches.map(m=>m.date));let h='';
for(let i=0;i<84;i++){const k=addDays(start,i),s=syn.has(k),t=tat.has(k),c=k>td?'f':s&&t?'st':s?'s':t?'t':mz.has(k)?'m':'';h+=`<i class="${c}" title="${plD(k)}"></i>`}return `<div class="heat" aria-label="Kalendarz 12 tygodni">${h}</div><div class="legend"><span style="--c:var(--tar)">${esc(kid())}</span>${kd?'':'<span style="--c:var(--blue2)">Ty</span>'}<span style="--c:var(--cone)">mecz</span><span style="--c:var(--line)">nic</span></div>`}
function resultsCard(){const rows=[];['A','B','C','S'].forEach(k=>SYN[k].steps.forEach(st=>{if(!st.tr||rows.some(r=>r.id===st.id))return;const v=S.logs.filter(l=>l.kind==='syn'&&l.res&&l.res[st.id]!=null).sort((a,b)=>a.ts-b.ts).map(l=>l.res[st.id]);if(v.length)rows.push({id:st.id,t:st.t,tr:st.tr,v})}));
return `<div class="card"><h3>Wyniki z ćwiczeń</h3>`+(rows.length?rows.map(r=>{const lo=r.tr.lower,best=lo?Math.min(...r.v):Math.max(...r.v),last=r.v[r.v.length-1],u=r.tr.u?' '+r.tr.u:'';return `<div class="metric"><div>${r.t}<small>${r.tr.l}: ostatnio ${cm(last)}${u} · rekord ${cm(best)}${u}</small></div>${spark(r.v,lo?-1:1)}</div>`}).join(''):'<p class="empty">W trakcie treningu wpisuj wyniki (celne strzały, wygrane pojedynki, czasy ze stopera). Tu zobaczysz postęp.</p>')+`</div>`}
function vPostep(){const kd=isKid();
const tests=[...S.tests].sort((a,b)=>a.date<b.date?-1:1);
let h=`<h2>Postęp</h2><div class="card"><div class="row"><h3>Ostatnie 12 tygodni</h3><span class="mut">seria ${streak()} tyg.</span></div>${heat(kd)}</div>`+resultsCard();
h+=`<div class="card"><h3>Testy: ${esc(kid())}</h3>`+(kd?`<p class="mut">Testy robicie raz w miesiącu, wyniki wpisuje tata.</p>`:`<p class="mut">Raz w miesiącu, na początku treningu. +${S.shop.tr.test} pkt, za rekord +${S.shop.tr.rec}.</p><div class="form">
<div><label for="t-date">Data</label><input id="t-date" type="date" value="${today()}"></div>
<div><label for="t-sprint">Sprint 20 m (s)</label><input id="t-sprint" inputmode="decimal" placeholder="np. 3,85"></div>
<div><label for="t-slalom">Slalom z piłką (s)</label><input id="t-slalom" inputmode="decimal" placeholder="np. 12,4"></div>
<div><label for="t-sciana">Ściana 30 s (podań)</label><input id="t-sciana" inputmode="numeric" placeholder="np. 18"></div>
<div><label for="t-dosr">10 dośrodkowań (pkt)</label><input id="t-dosr" inputmode="numeric" placeholder="0–20"></div>
</div><button class="btn wide" data-a="saveTest">Zapisz wyniki</button>`);
h+=METRICS.map(([k,n,u,dir])=>{const v=tests.filter(t=>t[k]!=null);if(!v.length)return `<div class="metric"><div>${n}<small>brak wyników</small></div><div></div></div>`;const vals=v.map(t=>t[k]),best=dir<0?Math.min(...vals):Math.max(...vals),last=vals[vals.length-1];return `<div class="metric"><div>${n}<small>Ostatnio ${cm(last)} ${u} · rekord ${cm(best)} ${u}${dir<0?' (mniej = lepiej)':''}</small></div>${spark(vals,dir)}</div>`}).join('');
const b6=logsBy('syn').filter(l=>l.score!=null).reverse();if(b6.length)h+=`<div class="metric"><div>Wyzwanie z treningów B<small>Ostatnio ${cm(b6[b6.length-1].score)} pkt · rekord ${cm(Math.max(...b6.map(l=>l.score)))} pkt</small></div>${spark(b6.map(l=>l.score),1)}</div>`;
if(tests.length&&!kd)h+='<details><summary class="link" style="display:block">Wszystkie wpisy</summary>'+[...tests].reverse().map(t=>`<div class="hist"><div>${plD(t.date)}<small>${METRICS.filter(m=>t[m[0]]!=null).map(m=>m[1]+': '+cm(t[m[0]])).join(' · ')}</small></div><button class="del" data-a="delTest" data-v="${esc(t.id)}">Usuń</button></div>`).join('')+'</details>';
h+='</div>';
const body=[...S.body].sort((a,b)=>a.date<b.date?-1:1),bw=body.filter(x=>x.w!=null),bh=body.filter(x=>x.h!=null);
const hMet=`<div class="metric"><div>Wzrost: ${esc(kid())}<small>${bh.length?`Ostatnio ${cm(bh[bh.length-1].h)} cm${bh.length>1?` · urósł ${cm(bh[bh.length-1].h-bh[0].h)} cm`:''}`:'brak pomiarów'}</small></div>${spark(bh.map(x=>x.h),1)}</div>`;
if(profile==='tata'){const names=[];Object.values(PLANS).forEach(p=>p.ex.forEach(e=>{if(!names.includes(e[0]))names.push(e[0])}));
const rows=names.map(nm=>{const l=lastFor(nm);if(!l)return '';return `<tr><td>${esc(nm)}<br><small class="mut">${plD(l.date)} · ${l.done}/${l.of} serii</small></td><td>${l.feel==='l'?'<span class="up">dołóż ↑</span>':l.feel==='h'?'<span class="dn">ciężko</span>':l.feel==='ok'?'w sam raz':''}</td></tr>`}).join('');
const wks=Array.from({length:8},(_,i)=>addDays(wkOf(today()),-7*(7-i)));const cnt=wks.map(w=>logsBy('tata').filter(l=>wkOf(l.date)===w).length);const mxC=Math.max(...cnt,1);
h+=`<div class="card"><h3>Twoje treningi</h3><p class="mut">Ile treningów w tygodniu.</p><div class="bars">${wks.map((w,i)=>`<div class="r"><span>${plD(w)}</span><i style="width:${cnt[i]/mxC*100}%"></i><span>${cnt[i]}</span></div>`).join('')}</div><h3 style="margin-top:14px">Ćwiczenia</h3>${rows?`<table class="ptab"><tbody>${rows}</tbody></table><p class="mut" style="margin-top:6px">Po prawej Twoja ocena z ostatniego razu.</p>`:'<p class="empty">Po pierwszym treningu zobaczysz tu swoje ćwiczenia.</p>'}</div>`;
h+=`<div class="card"><h3>Pomiary</h3><div class="form"><div><label for="b-w">Twoja waga (kg)</label><input id="b-w" inputmode="decimal" placeholder="np. 84,5"></div><div><label for="b-h">Wzrost: ${esc(kid())} (cm)</label><input id="b-h" inputmode="decimal" placeholder="np. 152"></div></div><button class="btn sec wide" data-a="saveBody">Zapisz pomiar</button>
<div class="metric"><div>Twoja waga<small>${bw.length?`Ostatnio ${cm(bw[bw.length-1].w)} kg${bw.length>1?` · zmiana ${bw[bw.length-1].w-bw[0].w>0?'+':''}${cm(bw[bw.length-1].w-bw[0].w)} kg`:''}`:'brak pomiarów'}</small></div>${spark(bw.map(x=>x.w),1,'var(--blue2)')}</div>${hMet}<p class="mut">Szybki wzrost to czas, by uważać na bóle kolan i pięt.</p></div>`}
else if(bh.length)h+=`<div class="card"><h3>Wzrost</h3>${hMet}</div>`;
const hist=[...S.logs].filter(l=>!kd||l.kind==='syn').sort((a,b)=>b.ts-a.ts).slice(0,25);
h+=`<div class="card"><h3>Historia treningów</h3>${hist.length?hist.map(l=>`<div class="hist"><div>${l.kind==='syn'?esc(kid()):'Ty'}: ${esc(l.name)}${l.lv?` (poziom ${l.lv})`:''}<small>${plD(l.date)} · ${l.min||0} min${l.score!=null?' · dośrodkowania '+esc(l.score)+' pkt':''}${l.nopts?' · bez punktów (za krótko)':''}</small></div>${kd?'':`<button class="del" data-a="delLog" data-v="${esc(l.id)}">Usuń</button>`}</div>`).join(''):'<p class="empty">Jeszcze nic. Pierwszy trening pojawi się tutaj.</p>'}</div>`;
return h}

function vSesja(){const p=SYN[active.key],n=p.steps.length,st=curStep();

function vLog(){const sts=tSteps(active.key),n=sts.length,i=active.step,st=sts[i],sc=schOf(st.sch),N=tNeed(st),d=active.done[i]||0,nx=sts[i+1];
let h=`<div class="prog"><i style="width:${(i+1)/n*100}%"></i></div><p class="tstep">${st.warm?'Rozgrzewka':`Ćwiczenie ${i} z ${n-1}`}${nx?` · potem: ${esc(nx.name)}`:' · ostatnie'}</p><div class="figbox">${figSVG(st.fig)}</div><h2 style="margin:0">${esc(st.name)}</h2>`;
if(st.warm)return h+`<p class="mut" style="margin-top:4px">Ok. 4 minuty, cicho, bez skakania.</p><ul class="cues">${st.cue.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><div class="card" style="margin-top:12px"><b>Potem pierwsze ćwiczenie:</b> zrób 1–2 lekkie serie po kilka powtórzeń, zanim zaczniesz właściwe serie.</div><p class="mut">Hantle odkładaj na matę albo ręcznik.</p>`;

/* ---------- data ---------- */
function fromDocs(docs){const n=blank();
for(const d of docs){if(!d.exists)continue;const v=JSON.parse(JSON.stringify(d.data()||{})),id=d.id,pre=id.slice(0,2);
if(id==='settings')n.settings=normSettings(v);else if(id==='budget')n.home.budget=normBudget(v);else if(id==='zfreq')n.home.freq=v.f&&typeof v.f==='object'?v.f:{};else if(id==='rmeta')n.home.rmeta=normRMeta(v);else if(id==='shop')n.shop=normShop(v);else if(id==='meta'){n.pts.badges=Array.isArray(v.badges)?v.badges:[];n.pts.goal=v.goal||null}
else if(pre==='w-')n.logs.push(v);else if(pre==='p-')n.pts.entries.push(v);else if(pre==='o-')n.pts.orders.push(v);else if(pre==='t-')n.tests.push(v);else if(pre==='m-')n.matches.push(v);else if(pre==='b-')n.body.push(v);else if(pre==='q-')n.reqs.push(v);else if(pre==='z-')n.home.items.push(v);else if(pre==='e-')n.home.tx.push(v);else if(pre==='r-'){const r=normRec(v);if(r)n.home.rec.push(r)}else if(pre==='f-'){if(v&&v.img)PHF[id.slice(2)]=v.img}
else if(id==='pts'){const o=normPts(v);n.pts.entries.push(...o.entries);n.pts.orders.push(...o.orders);n.pts.badges=o.badges;n.pts.goal=o.goal}else if(id==='tests'&&Array.isArray(v.entries))n.tests.push(...v.entries);else if(id==='matches'&&Array.isArray(v.entries))n.matches.push(...v.entries);else if(id==='body'&&Array.isArray(v.entries))n.body.push(...v.entries)}
n.home.items=n.home.items.filter(i=>i&&i.id&&i.n);n.home.tx=n.home.tx.filter(t=>t&&t.id&&t.d&&t.amt>0);n.pts.entries.sort((a,b)=>a.ts-b.ts);return n}
function apply(snap){const n=fromDocs(snap.docs);
S=n;if(snap.docs.some(d=>d.id==='shop'))upgradeShop();saveLocal();applyTheme();if(view==='zakupy'&&!$('#modal').innerHTML&&document.activeElement&&document.activeElement.id==='zIn'){zRefresh();return}if(view==='przepisy'&&!$('#modal').innerHTML&&document.activeElement&&document.activeElement.id==='rIn'){rRefresh();return}if(['log','sesja','tydzien','sklepEdit','mecz','ustawienia','koniec','plan'].includes(view)||$('#modal').innerHTML)pendingRender=true;else render()}
let FB=null,unsub=null,lastSig='';
async function fbCol(fam){
if(!FB){const v='10.12.2',A=await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),F=await import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`);const app=A.initializeApp(FB_CFG);let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}FB={F,db}}
const {F,db}=FB,base=F.collection(db,'families',fam,'docs'),pbase=F.collection(db,'families',fam,'photos');
const wrap=sn=>({docs:sn.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()})),empty:sn.empty,metadata:{fromCache:sn.metadata.fromCache,hasPendingWrites:sn.metadata.hasPendingWrites}});
return{photo:id=>({set:d=>F.setDoc(F.doc(pbase,id),d),get:async()=>{const x=await F.getDoc(F.doc(pbase,id));return x.exists()?x.data():null},delete:()=>F.deleteDoc(F.doc(pbase,id))}),srv:async()=>(await F.getDocsFromServer(F.query(base,F.limit(1)))).empty?0:1,doc:id=>({set:d=>F.setDoc(F.doc(base,id),JSON.parse(JSON.stringify(d))),delete:()=>F.deleteDoc(F.doc(base,id))}),onSnapshot:(cb,err)=>F.onSnapshot(base,{includeMetadataChanges:true},sn=>cb(wrap(sn)),err),get:async()=>wrap(await F.getDocs(base))}}
async function connectFb(){if(unsub){try{unsub()}catch(e){}unsub=null}col=null;lastSig='';
const fam=getFam();if(!FB_CFG.projectId){setSync('local');return}if(!fam){setSync('nofam');return}
setSync('loading');let c;try{c=await fbCol(fam)}catch(e){setSync('stale');toast('Nie udało się połączyć z bazą. Działam na tym telefonie.');return}
if(getFam()!==fam)return;col=c;const local=JSON.parse(JSON.stringify(S));let first=true,migrating=false,lastSnap=null;
const hasData=x=>x.logs.length||x.tests.length||x.pts.entries.length||x.matches.length||x.settings.name||x.home&&(x.home.tx.length||x.home.items.length);
const tm=setTimeout(()=>{if(syncState!=='cloud')setSync('stale')},10000);
unsub=col.onSnapshot(sn=>{if(migrating){lastSnap=sn;return}devSnap(sn.docs);if(devKicked)return;if(!sn.metadata.fromCache){clearTimeout(tm);try{localStorage.setItem('trening-famok',fam)}catch(e){}if(syncState!=='cloud'){setSync('cloud');setTimeout(()=>devPing(),800);if(view!=='sesja'&&view!=='log')head()}}
if(first&&!sn.metadata.fromCache){first=false;if(sn.empty&&hasData(local)){migrating=true;S=local;saveLocal();pushAll();q.then(()=>{migrating=false;toast('Dane wysłane do rodziny');if(lastSnap)apply(lastSnap)});return}}
if(sn.empty&&sn.metadata.fromCache)return;
const sig=JSON.stringify(sn.docs.filter(d=>!d.id.startsWith('d-')).map(d=>d.id.startsWith('f-')?[d.id]:[d.id,d.data()]));if(sig===lastSig)return;lastSig=sig;apply(sn)},err=>{clearTimeout(tm);setSync('stale')})}
async function connect(){
const C=window.claude;if(!C||!C.use)return connectFb();
let db=null,uid=null,cw=null;try{db=await C.use('db');const u=await C.use('user');uid=u?await u.id():null;if(u&&u.can)cw=await u.can('data.write')}catch(e){}
if(!db||!uid){setSync('local');return}
if(cw===false){setSync('readonly');return}
const local=JSON.parse(JSON.stringify(S));col=db.collection('family');let first=true;
const tm=setTimeout(()=>setSync('stale'),10000);
const hasData=x=>x.logs.length||x.tests.length||x.pts.entries.length||x.matches.length||x.settings.name||x.home&&(x.home.tx.length||x.home.items.length);
let migrating=false,lastSnap=null;
col.onSnapshot(async snap=>{if(migrating){lastSnap=snap;return}if(!snap.metadata.fromCache){clearTimeout(tm);if(syncState!=='cloud'){setSync('cloud');if(view!=='sesja'&&view!=='log')head()}}
if(first&&!snap.metadata.fromCache){first=false;if(snap.empty){migrating=true;let old=null;try{if(uid){const g=await db.collection('data/users/'+uid).get();if(!g.empty)old=fromDocs(g.docs)}}catch(e){}
const src=old&&hasData(old)?old:hasData(local)?local:null;if(src){S=src;saveLocal();pushAll();render();toast('Przenoszę dane do wersji z synchronizacją…');q.then(()=>{migrating=false;toast('Dane przeniesione');if(lastSnap)apply(lastSnap)});return}migrating=false;if(lastSnap){apply(lastSnap);return}}}
apply(snap)},err=>{clearTimeout(tm);col=null;setSync(err&&err.code==='revoked'?'local':'stale')})}

upgradeShop();applyTheme();render();setInterval(tick,250);connect();
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({active,rest}))}
const H=window.claude&&window.claude.hot;

}
